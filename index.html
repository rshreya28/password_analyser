<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Password Strength Analyzer</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Password Strength Analyzer</h1>

        <div class="input-box">

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                onkeyup="checkPassword()"
            >

            <button class="show-btn" onclick="togglePassword()">
                Show
            </button>

        </div>

        <div class="strength-bar">
            <div id="bar"></div>
        </div>

        <div id="strength-text"></div>

        <div class="checks">

            <p id="length-check">❌ Minimum 8 characters</p>

            <p id="uppercase-check">❌ Uppercase letter</p>

            <p id="lowercase-check">❌ Lowercase letter</p>

            <p id="number-check">❌ Number</p>

            <p id="special-check">❌ Special character</p>

        </div>

        <div id="suggestion"></div>

        <button class="generate-btn" onclick="generatePassword()">
            Generate Strong Password
        </button>

        <div id="generated-password"></div>

    </div>

    <script src="script.js"></script>

</body>

</html>
